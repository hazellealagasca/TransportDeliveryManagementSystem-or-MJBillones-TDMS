<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" id="app-viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>M.J. Billones Transport Service - Delivery Management System</title>
  <link rel="icon" type="image/x-icon" href="assets/app.ico">
  <!-- Offline-Ready Local Tailwind CSS Engine -->
  <script src="js/tailwind.js"></script>
  <!-- Exact WinForms Desktop Replica Stylesheet (Mobile, Tablet & Desktop Responsive) -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-[#F3F4F6] text-[#1E293B] antialiased min-h-screen flex flex-col select-none">

  <!-- ================= AUTH CONTAINER (EXACT LoginForm.cs REPLICA - MOBILE & TABLET FRIENDLY) ================= -->
  <div id="auth-container" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-[#0F172A] overflow-y-auto select-none">
    
    <!-- Full-Screen Background Image (assets/login_bg.jpg) -->
    <div class="fixed inset-0 bg-cover bg-center pointer-events-none" style="background-image: url('assets/login_bg.jpg');"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-[#0D1526]/45 via-[#0F172A]/55 to-[#0A0F1C]/75 pointer-events-none"></div>

    <!-- Top-Right Frosted Window Control Buttons (Visible on Tablet/Desktop) -->
    <div class="hidden sm:flex fixed top-3.5 right-4 items-center space-x-1.5 z-20">
      <button type="button" class="w-[42px] h-[34px] rounded-[10px] bg-[#141E32]/75 hover:bg-[#23304A]/90 border border-white/25 text-white flex items-center justify-center transition" title="Minimize">
        <span class="w-3.5 h-0.5 bg-white rounded-full"></span>
      </button>
      <button type="button" class="w-[42px] h-[34px] rounded-[10px] bg-[#141E32]/75 hover:bg-[#DC2626] border border-white/25 text-white flex items-center justify-center transition font-bold text-sm" title="Close">
        ✕
      </button>
    </div>

    <!-- Frosted Glass Card (Responsive padding & sizing for Phone, Tablet & Desktop, Neon Crimson Border & Outer Glow) -->
    <div class="relative z-10 w-full max-w-[500px] my-auto rounded-[22px] sm:rounded-[24px] px-5 py-5 sm:px-[46px] sm:py-[22px] border-2 border-[#E11D48] shadow-[0_0_32px_rgba(239,68,68,0.45),0_25px_50px_-12px_rgba(0,0,0,0.85)] text-center backdrop-blur-md" style="background: linear-gradient(180deg, rgba(13,21,38,0.82) 0%, rgba(10,15,28,0.90) 100%);">
      
      <!-- Top Specular Sheen -->
      <div class="pointer-events-none absolute inset-x-0 top-0 h-[140px] sm:h-[180px] rounded-t-[21px] sm:rounded-t-[23px]" style="background: linear-gradient(180deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 100%);"></div>

      <!-- Frosted White Badge with Eagle Logo -->
      <div class="relative w-full max-w-[280px] sm:max-w-[340px] h-[96px] sm:h-[125px] mx-auto mb-2.5 sm:mb-3 rounded-[22px] sm:rounded-[28px] p-2.5 sm:p-3 shadow-[0_4px_12px_rgba(0,0,0,0.35)] flex items-center justify-center border-[1.8px] border-white/90 backdrop-blur-md" style="background: linear-gradient(180deg, rgba(255,255,255,0.68) 0%, rgba(241,245,249,0.58) 100%);">
        <img src="assets/logo_clean.png" onerror="this.onerror=null; this.src='assets/logo.png';" alt="M.J. Billones Logo" class="max-h-full max-w-full object-contain drop-shadow">
      </div>

      <!-- Title & Subtitle -->
      <h1 class="text-[24px] sm:text-[28px] font-bold text-white tracking-tight leading-tight mt-1">Login</h1>
      <p class="text-[12.5px] sm:text-[13px] text-[#C3D0E1] mt-1 mb-4 sm:mb-5">Welcome back! Please login to your account</p>

      <!-- Alert Box -->
      <div id="login-error" class="hidden mb-3.5 py-2 px-3 bg-[#581C1C]/85 border border-[#EF4444] text-[#FECACA] text-xs font-semibold rounded-[9px] text-center"></div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-3.5 sm:space-y-4 text-left">
        <div>
          <label class="block text-[12.5px] font-normal text-[#D7E1EE] mb-1 ml-0.5">Username</label>
          <div class="relative flex items-center">
            <span class="absolute left-3.5 text-[#9EAEC4] pointer-events-none">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"></circle>
                <path stroke-linecap="round" d="M5 20c1.5-3.5 4.2-5 7-5s5.5 1.5 7 5"></path>
              </svg>
            </span>
            <input type="text" id="login-username" value="admin" required class="w-full h-[46px] sm:h-[48px] pl-11 pr-4 rounded-[12px] bg-[#161F30] border border-[#526278] focus:border-[#EF4444] focus:shadow-[0_0_0_3px_rgba(239,68,68,0.28)] focus:outline-none text-white text-[14px] transition placeholder-[#94A3B8]" placeholder="Enter your username">
          </div>
        </div>

        <div>
          <label class="block text-[12.5px] font-normal text-[#D7E1EE] mb-1 ml-0.5">Password</label>
          <div class="relative flex items-center">
            <span class="absolute left-3.5 text-[#9EAEC4] pointer-events-none">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                <path stroke-linecap="round" d="M8 11V7a4 4 0 0 1 8 0v4"></path>
              </svg>
            </span>
            <input type="password" id="login-password" value="admin123" required class="w-full h-[46px] sm:h-[48px] pl-11 pr-11 rounded-[12px] bg-[#161F30] border border-[#526278] focus:border-[#EF4444] focus:shadow-[0_0_0_3px_rgba(239,68,68,0.28)] focus:outline-none text-white text-[14px] transition placeholder-[#94A3B8]" placeholder="Enter password">
            <button type="button" id="btn-toggle-login-pass" class="absolute right-2.5 w-9 h-9 rounded-lg flex items-center justify-center text-[#AFBED2] hover:text-white hover:bg-white/10 transition focus:outline-none" title="Show/Hide Password">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between text-[12.5px] pt-0.5">
          <label class="flex items-center text-[#D7E1EE] cursor-pointer space-x-2">
            <input type="checkbox" id="remember-me" checked class="w-[18px] h-[18px] rounded-[5px] accent-[#DC2626] bg-[#161F30] border-[#73849B] cursor-pointer">
            <span>Remember Me</span>
          </label>
          <button type="button" id="forgot-password-link" class="text-[#FA7878] hover:text-white hover:underline">Forgot Password?</button>
        </div>

        <!-- Gradient Crimson Login Button -->
        <button type="submit" class="w-full h-[48px] sm:h-[52px] rounded-[14px] font-bold text-[15px] text-white tracking-wide hover:brightness-110 active:brightness-95 transition shadow-[0_6px_16px_rgba(185,28,28,0.45)] border border-white/40 mt-1.5" style="background: linear-gradient(180deg, #D72222 0%, #991B1B 100%);">
          LOGIN
        </button>
      </form>

      <!-- Lock Notice -->
      <div class="mt-4 sm:mt-5 flex items-center justify-center space-x-2 text-[12px] sm:text-[12.5px] text-[#AFBED2]">
        <svg class="w-3.5 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <rect x="4" y="10" width="16" height="11" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
        <span>Authorized Personnel Only</span>
      </div>

      <!-- Copyright -->
      <p class="text-[11px] text-[#8796AC] mt-1.5">© M.J. Billones Transport Service • All rights reserved.</p>
    </div>
  </div>

  <!-- ================= APPLICATION SHELL (EXACT SCREENSHOTS 01-24 + MOBILE/TABLET FRIENDLY) ================= -->
  <div id="app-container" class="hidden flex-1 flex flex-col h-screen overflow-hidden">
    
    <!-- 1. Windows 10/11 Form Titlebar (Shown on Tablet/Desktop, hidden on small phone screens to maximize workspace) -->
    <div class="window-titlebar hidden md:flex flex-shrink-0 select-none">
      <div class="flex items-center space-x-2 truncate">
        <img src="assets/logo_clean.png" onerror="this.onerror=null; this.src='assets/logo.png';" alt="Eagle Icon" class="w-4 h-4 object-contain flex-shrink-0">
        <span class="text-[#1E293B] font-normal text-[12px] truncate">M.J. Billones Transport Service - Delivery Management System</span>
      </div>
      <div class="flex items-center space-x-5 text-[#64748B] text-[12px] pr-1 flex-shrink-0">
        <span class="hover:text-slate-900 cursor-pointer px-1.5">─</span>
        <span class="hover:text-slate-900 cursor-pointer px-1.5">□</span>
        <span class="hover:text-red-600 cursor-pointer px-1.5">✕</span>
      </div>
    </div>

    <!-- 2. Main Body Row: Left Dark Charcoal Rail (#1C1917) + Right Workspace Column -->
    <div class="flex-1 flex overflow-hidden relative">
      
      <!-- Mobile Slide-Over Backdrop -->
      <div id="mobile-sidebar-backdrop" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden"></div>

      <!-- Left Rail Sidebar (56px rail on Tablet/Desktop; Slide-over drawer on Mobile) -->
      <aside id="panel-sidebar" class="fixed md:static inset-y-0 left-0 -translate-x-full md:translate-x-0 w-[210px] md:w-[56px] transition-all duration-200 bg-[#1C1917] text-[#A8A29E] flex-shrink-0 flex flex-col justify-between z-50 select-none shadow-2xl md:shadow-none">
        <div class="flex flex-col items-center">
          <!-- Eagle Logo Directly on Dark Charcoal Rail -->
          <div class="w-full h-[68px] md:h-[78px] flex items-center justify-between md:justify-center border-b border-[#2E2B29] px-3 md:px-1.5">
            <div class="flex items-center space-x-2.5">
              <img src="assets/logo_clean.png" onerror="this.onerror=null; this.src='assets/logo.png';" class="w-10 h-10 md:w-11 md:h-11 object-contain flex-shrink-0" alt="M.J. Billones Eagle">
              <span class="nav-label md:hidden text-white font-bold text-xs leading-tight">M.J. Billones<br><span class="text-[10px] text-[#A8A29E] font-normal">Transport System</span></span>
            </div>
            <button id="btn-close-mobile-sidebar" class="md:hidden text-[#A8A29E] hover:text-white text-lg px-1">✕</button>
          </div>

          <!-- 6 Monochrome Outline SVG Hub Icons -->
          <nav class="py-3 flex flex-col items-center space-y-1.5 md:space-y-2 w-full px-2 md:px-1.5">
            <!-- 1. Dashboard -->
            <button class="nav-hub-btn w-full md:w-11 h-11 md:h-10 px-3 md:px-0 rounded-xl flex items-center justify-start md:justify-center text-[#A8A29E] hover:text-white hover:bg-[#2E2B29]/60 transition relative" data-hub="dashboard" title="Dashboard">
              <span class="nav-indicator hidden absolute left-0 md:-left-1.5 top-2.5 bottom-2.5 w-[3px] bg-[#B4182C] rounded-r"></span>
              <svg class="w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                <path stroke-linecap="round" d="M8 16v-4M12 16V8M16 16v-6"></path>
              </svg>
              <span class="nav-label md:hidden ml-3 text-xs font-semibold whitespace-nowrap">Dashboard</span>
            </button>

            <!-- 2. Operations -->
            <button class="nav-hub-btn active w-full md:w-11 h-11 md:h-10 px-3 md:px-0 rounded-xl flex items-center justify-start md:justify-center text-white bg-[#2E2B29] transition relative" data-hub="operations" title="Operations">
              <span class="nav-indicator absolute left-0 md:-left-1.5 top-2.5 bottom-2.5 w-[3px] bg-[#B4182C] rounded-r"></span>
              <svg class="w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M1 4h14v11H1zM15 8h4l3 3v4h-7V8z"></path>
                <circle cx="5.5" cy="17.5" r="2"></circle>
                <circle cx="18.5" cy="17.5" r="2"></circle>
              </svg>
              <span class="nav-label md:hidden ml-3 text-xs font-semibold whitespace-nowrap">Operations</span>
            </button>

            <!-- 3. Resources -->
            <button class="nav-hub-btn w-full md:w-11 h-11 md:h-10 px-3 md:px-0 rounded-xl flex items-center justify-start md:justify-center text-[#A8A29E] hover:text-white hover:bg-[#2E2B29]/60 transition relative" data-hub="resources" title="Resources">
              <span class="nav-indicator hidden absolute left-0 md:-left-1.5 top-2.5 bottom-2.5 w-[3px] bg-[#B4182C] rounded-r"></span>
              <svg class="w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" d="M16 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 17.5V19"></path>
                <circle cx="10" cy="8.5" r="3"></circle>
                <path stroke-linecap="round" d="M20 19v-1.5a3 3 0 0 0-2.2-2.9M15.5 5.8a3 3 0 0 1 0 5.4"></path>
              </svg>
              <span class="nav-label md:hidden ml-3 text-xs font-semibold whitespace-nowrap">Resources</span>
            </button>

            <!-- 4. Payments / Finance -->
            <button class="nav-hub-btn w-full md:w-11 h-11 md:h-10 px-3 md:px-0 rounded-xl flex items-center justify-start md:justify-center text-[#A8A29E] hover:text-white hover:bg-[#2E2B29]/60 transition relative" data-hub="finance" title="Payments">
              <span class="nav-indicator hidden absolute left-0 md:-left-1.5 top-2.5 bottom-2.5 w-[3px] bg-[#B4182C] rounded-r"></span>
              <svg class="w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 3h6l-1 3.5H10L9 3zM6 9.5c0-1.7 1.3-3 3-3h6c1.7 0 3 1.3 3 3v7.5c0 2.2-1.8 4-4 4h-4c-2.2 0-4-1.8-4-4V9.5z"></path>
                <path stroke-linecap="round" d="M12 10.5v6M10.2 12.2c0-.8.8-1.2 1.8-1.2s1.8.4 1.8 1.2-.8 1-1.8 1.3-1.8.5-1.8 1.3.8 1.2 1.8 1.2 1.8-.4 1.8-1.2"></path>
              </svg>
              <span class="nav-label md:hidden ml-3 text-xs font-semibold whitespace-nowrap">Payments</span>
            </button>

            <!-- 5. Master Data -->
            <button class="nav-hub-btn w-full md:w-11 h-11 md:h-10 px-3 md:px-0 rounded-xl flex items-center justify-start md:justify-center text-[#A8A29E] hover:text-white hover:bg-[#2E2B29]/60 transition relative" data-hub="masterdata" title="Master Data">
              <span class="nav-indicator hidden absolute left-0 md:-left-1.5 top-2.5 bottom-2.5 w-[3px] bg-[#B4182C] rounded-r"></span>
              <svg class="w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L3 13V4h9l8.59 7.59a2 2 0 0 1 0 1.82z"></path>
                <circle cx="7.5" cy="8.5" r="1.2"></circle>
              </svg>
              <span class="nav-label md:hidden ml-3 text-xs font-semibold whitespace-nowrap">Master Data</span>
            </button>

            <!-- 6. Settings -->
            <button class="nav-hub-btn w-full md:w-11 h-11 md:h-10 px-3 md:px-0 rounded-xl flex items-center justify-start md:justify-center text-[#A8A29E] hover:text-white hover:bg-[#2E2B29]/60 transition relative" data-hub="settings" title="Settings">
              <span class="nav-indicator hidden absolute left-0 md:-left-1.5 top-2.5 bottom-2.5 w-[3px] bg-[#B4182C] rounded-r"></span>
              <svg class="w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
              <span class="nav-label md:hidden ml-3 text-xs font-semibold whitespace-nowrap">Settings</span>
            </button>
          </nav>
        </div>

        <!-- Bottom Crescent Moon Toggle -->
        <div class="w-full py-3 border-t border-[#2E2B29] flex items-center justify-center px-2">
          <button id="btn-toggle-darkmode" class="w-full md:w-10 h-10 px-3 md:px-0 rounded-xl flex items-center justify-start md:justify-center text-[#A8A29E] hover:text-white hover:bg-[#2E2B29] transition" title="Toggle Dark Mode">
            <svg class="w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span class="nav-label md:hidden ml-3 text-xs font-semibold whitespace-nowrap">Dark / Light Theme</span>
          </button>
        </div>
      </aside>

      <!-- Right Workspace Column: White Header + Sub-Nav Tabs Strip + Main Content -->
      <div class="flex-1 flex flex-col min-w-0 bg-[#F3F4F6] overflow-hidden">
        
        <!-- White App Header (Responsive for Phone, Tablet & Desktop) -->
        <header class="bg-white border-b border-[#E5E7EB] px-3 sm:px-5 py-2 sm:py-0 sm:h-[64px] flex flex-wrap sm:flex-nowrap items-center justify-between gap-2 flex-shrink-0 z-30 select-none">
          
          <!-- Left: Hamburger + Hub Title + User Subtitle -->
          <div class="flex items-center space-x-2.5 sm:space-x-4 min-w-0">
            <button id="btn-toggle-pin" class="w-9 h-9 sm:w-8 sm:h-8 rounded-lg hover:bg-slate-100 text-[#334155] flex items-center justify-center text-lg transition flex-shrink-0" title="Toggle Sidebar">
              ☰
            </button>

            <div id="header-user-badge" class="flex flex-col cursor-pointer truncate" title="User Profile">
              <h1 id="page-hub-title" class="text-[16px] sm:text-[19px] font-semibold text-[#0F172A] leading-tight truncate">Operations</h1>
              <span id="header-user-info" class="text-[11px] sm:text-[12px] text-[#64748B] leading-tight mt-0.5 truncate">Marie Ann J. Billones  ·  Owner/Admin</span>
            </div>
          </div>

          <!-- Right: 4 Pastel KPI Pills + Settings + Log out (Horizontally scrollable on narrow mobile screens) -->
          <div class="flex items-center space-x-1.5 sm:space-x-2 overflow-x-auto max-w-full pb-0.5 sm:pb-0 no-scrollbar">
            <button class="kpi-pill kpi-pill-scheduled" id="kpi-pill-scheduled" title="View Scheduled Orders">
              <span class="text-[#B45309]">⏳</span>
              <span id="kpi-scheduled-text">2 scheduled</span>
            </button>
            <button class="kpi-pill kpi-pill-transit" id="kpi-pill-transit" title="View In-Transit Orders">
              <span class="text-[#0284C7]">🚚</span>
              <span id="kpi-transit-text">2 in transit</span>
            </button>
            <button class="kpi-pill kpi-pill-unpaid" id="kpi-pill-unpaid" title="View Unpaid Invoices">
              <span class="text-[#DC2626]">💳</span>
              <span id="kpi-unpaid-text">1 unpaid</span>
            </button>
            <button class="kpi-pill kpi-pill-alert" id="kpi-pill-alert" title="View System Alerts">
              <span class="text-[#E11D48]">🔔</span>
              <span id="kpi-alerts-text">19 new</span>
            </button>

            <button id="btn-header-settings" class="h-[32px] sm:h-[36px] px-2.5 sm:px-4 rounded-lg border border-[#E5E7EB] bg-white hover:bg-slate-50 text-[#1E293B] text-[11px] sm:text-[12px] font-semibold inline-flex items-center gap-1.5 transition flex-shrink-0">
              <span>⚙️</span>
              <span class="hidden sm:inline">Settings</span>
            </button>

            <button id="btn-header-logout" class="h-[32px] sm:h-[36px] px-2.5 sm:px-4 rounded-lg border border-[#E5E7EB] bg-white hover:bg-slate-50 text-[#1E293B] text-[11px] sm:text-[12px] font-semibold inline-flex items-center transition flex-shrink-0 whitespace-nowrap">
              Log out
            </button>
          </div>
        </header>

        <!-- Sub-Nav Tabs Strip (White strip inside #F3F4F6 canvas, horizontally scrollable on mobile/tablet) -->
        <div id="hub-subtabs-bar" class="mx-2 sm:mx-4 mt-2 sm:mt-3 px-2.5 sm:px-4 py-1.5 sm:py-2 flex items-center space-x-1.5 sm:space-x-3 bg-white rounded-md border border-[#E5E7EB]/80 overflow-x-auto flex-shrink-0 no-scrollbar">
          <!-- Injected dynamically per Hub -->
        </div>

        <!-- Dynamic Main Workspace View -->
        <main id="main-content-view" class="flex-1 p-2 sm:p-4 pb-16 md:pb-4 overflow-y-auto overflow-x-hidden">
          <!-- Active Screen View Injected Here -->
